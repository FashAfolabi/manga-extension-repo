name: Generate Index

on:
  push:
    branches: [ main ]
    paths:
      - 'apks/*'
      - 'scripts/generate_index.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate index
        run: python scripts/generate_index.py

      - name: Commit JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.json index.min.json
          git commit -m "Auto-update index files" || echo "No changes"
          git push
