name: Generate Index & Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'apks/*.apk'
      - 'scripts/generate_index.py'
      - '.github/workflows/build.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Generate JSON
      - name: Generate index.json
        run: python scripts/generate_index.py

      # Commit JSON back to repo
      - name: Commit index files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.json index.min.json
          git commit -m "Auto-update index files" || echo "No changes"
          git push

      # Create Release per APK
      - name: Create Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.head_commit.message }}
          name: ${{ github.event.head_commit.message }}
          files: apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
