name: Generate Index

on:
  push:
    branches: [ repo ]          # ← changed from main
    paths:
      - 'apks/**'
      - 'scripts/generate_index.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:            # allows manual run

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo               # ← important: always work on repo branch
          fetch-depth: 0          # needed for rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate index.json
        run: python scripts/generate_index.py

      - name: Commit and push index files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add index.json index.min.json
          git commit -m "Auto-update index files" || echo "No changes to commit"
          
          git pull origin repo --rebase   # ← fixes your push conflict
          git push origin repo
