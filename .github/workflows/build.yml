name: Generate Index & Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'apks/*.apk'
      - 'scripts/generate_index.py'
      - '.github/workflows/build.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate index.json
        run: python scripts/generate_index.py

      - name: Create minified index
        run: |
          python -m json.tool index.json > temp.json
          cat temp.json | tr -d '\n ' > index.min.json
          rm temp.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
